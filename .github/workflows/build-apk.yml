name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 【修改点 1】升级到 Node.js 22，满足最新 Capacitor CLI 的硬性要求
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unzip & build APK
        run: |
          # 1. 解压仓库里的 zip 文件
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p extracted_app
            unzip -q "$ZIP_FILE" -d extracted_app
          fi

          # 2. 定位 package.json 所在目录
          PKG_PATH=$(find . -maxdepth 4 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "未找到 package.json"
            exit 1
          fi
          APP_DIR=$(dirname "$PKG_PATH")
          cd "$APP_DIR"

          # 3. 安装依赖并打包网页
          npm install --legacy-peer-deps
          
          # 【修改点 2】显式安装 TypeScript 5，防止 Node 22 默认解析 capacitor.config.ts 时报错
          npm install typescript@5 --save-dev --legacy-peer-deps
          
          npm run build

          # 4. 初始化 Capacitor Android 项目
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "韩语研习社" "com.korean.studio" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

          # 5. 修复 Kotlin 依赖版本冲突
          # 【修改点 3】强制对齐到 1.8.22，与 Capacitor 原生依赖保持兼容，避免强行升 1.9.22 导致冲突
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

          # 6. 编译生成 Debug APK
          cd android
          chmod +x gradlew
          # 【修改点 4】添加 --stacktrace，如果未来再报错，日志会显示具体的 Java/Kotlin 堆栈信息
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: korean-studio-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
