name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Unzip & build APK
        run: |
          mkdir -p extracted_app
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} -d extracted_app \;

          PKG_PATH=$(find . -maxdepth 5 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "错误：解压后仍未找到 package.json"
            exit 1
          fi
          APP_DIR=$(dirname "$PKG_PATH")
          echo "找到项目目录: $APP_DIR"
          cd "$APP_DIR"

          npm install --legacy-peer-deps
          npm run build

          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.korean.studio",
            "appName": "韩语研习社",
            "webDir": "dist"
          }
          EOF

          npx cap add android || true
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/output-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output-apk/korean-studio.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: korean-studio-apk
          path: output-apk/korean-studio.apk
