name: Test Build APK (Fixed TS Version)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          mkdir extracted_folder
          unzip -o *.zip -d extracted_folder
          if [ $(ls -1 extracted_folder | wc -l) -eq 1 ] && [ -d "extracted_folder/$(ls -1 extracted_folder)" ]; then
            mv extracted_folder/*/* .
          else
            mv extracted_folder/* .
          fi
          rm -rf extracted_folder
          rm -f *.zip
        fi

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Prepare Capacitor & Project
      run: |
        HTML_DIR=$(find . -name "index.html" -type f | head -n 1 | xargs dirname)
        mkdir -p www
        cp -r "$HTML_DIR"/* www/ 2>/dev/null || true
        npm init -y
        # 【关键修复】安装 Capacitor 时，强制指定兼容的 TypeScript 5.9.0 版本
        npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 typescript@5.9.0

    - name: Build APK
      run: |
        # 【关键修复】在执行 cap init 前，再次确保 TypeScript 版本正确
        npm install typescript@5.9.0
        npx cap init "KoreanApp" "com.korean.app" --web-dir=www
        npx cap add android
        npx cap sync android
        sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
        cd android
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.11.1
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
